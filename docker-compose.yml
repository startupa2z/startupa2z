services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: startupa2z
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d startupa2z"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/startupa2z
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:-change_this_to_a_long_random_secret}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@startupa2z.org}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080,http://localhost:8081,https://startupa2z.org,https://www.startupa2z.org}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      LINKEDIN_REDIRECT_URI: ${LINKEDIN_REDIRECT_URI:-https://startupa2z.org/api/auth/oauth/linkedin/callback}
      FRONTEND_URL: ${FRONTEND_URL:-https://startupa2z.org}
      ADMIN_DEV_LOGIN_ENABLED: ${ADMIN_DEV_LOGIN_ENABLED:-false}
      ADMIN_DEV_USERNAME: ${ADMIN_DEV_USERNAME:-}
      ADMIN_DEV_PASSWORD: ${ADMIN_DEV_PASSWORD:-}
    volumes:
      - event_images:/app/static/images
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
    labels:
      - "traefik.docker.network=lr52bqjdhgft47h5gppqbose"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_WHATSAPP_COMMUNITY_URL: ${VITE_WHATSAPP_COMMUNITY_URL:-}
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - default
    labels:
      - "traefik.docker.network=lr52bqjdhgft47h5gppqbose"

volumes:
  postgres_data:
  event_images:

networks:
  default:
  coolify:
    external: true
